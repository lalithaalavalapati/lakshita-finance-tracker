<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense | Personal Finance Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .page {
            max-width: 650px;
            margin: 35px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button,
        .btn {
            display: inline-block;
            margin-top: 18px;
            padding: 11px 16px;
            background: #16834a;
            color: white;
            border: 0;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
        }

        .btn {
            background: #334155;
        }

        .flash {
            padding: 12px;
            background: #eef2ff;
            border-radius: 7px;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="card">
            <h1>✏️ Edit Expense</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <p class="flash">{{ message }}</p>
            {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('edit_expense', expense_id=expense.id) }}">

                <label for="title">Expense name</label>
                <input id="title" name="title" value="{{ expense.title }}" required>

                <label for="amount">Amount (₹)</label>
                <input id="amount" name="amount" type="number" min="0.01" step="0.01" value="{{ expense.amount }}"
                    required>

                <label for="category">Category</label>
                <select id="category" name="category" required>
                    {% for category in categories %}
                    <option value="{{ category }}" {% if expense.category==category %}selected{% endif %}>
                        {{ category }}
                    </option>
                    {% endfor %}
                </select>

                <label for="date">Date</label>
                <input id="date" name="date" type="date" value="{{ expense.date }}" max="{{ today }}" required>

                <label for="expense_type">Expense type</label>
                <select id="expense_type" name="expense_type" required>
                    <option value="Mandatory" {% if expense.expense_type=='Mandatory' %}selected{% endif %}>
                        Mandatory - Essential
                    </option>
                    <option value="Optional" {% if expense.expense_type=='Optional' %}selected{% endif %}>
                        Optional - Can be reduced
                    </option>
                </select>

                <button type="submit">Save Changes</button>
                <a class="btn" href="{{ url_for('expenses') }}">Cancel</a>
            </form>
        </div>
    </div>
</body>

</html>
